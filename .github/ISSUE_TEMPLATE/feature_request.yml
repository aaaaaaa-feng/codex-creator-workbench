name: 功能建议
description: 提议新的创作流程、平台适配或工作台能力
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 创作场景
      description: 你在创作哪类内容、准备发到哪里、现在卡在哪一步？
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 期望流程
      description: 最理想的一次操作应该发生什么？
    validations:
      required: true
  - type: dropdown
    id: content_type
    attributes:
      label: 内容类型
      options:
        - 视频口播
        - 教程或演示视频
        - 图文或长文
        - 多平台适配
        - 发布与复盘
        - 其他
  - type: textarea
    id: boundaries
    attributes:
      label: 不能接受的自动化
      description: 例如不能自动发布、不能改动原稿、必须先人工确认。
