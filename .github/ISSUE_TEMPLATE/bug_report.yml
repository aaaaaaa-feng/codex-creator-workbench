name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请不要粘贴 API Key、Cookie、AIHOT 私有地址或本地创作内容。
  - type: textarea
    id: problem
    attributes:
      label: 问题是什么？
      description: 请说明你看到了什么，以及原本期望看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      placeholder: |
        1. 启动工作台
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与 Node.js 版本
      placeholder: macOS 15 / Windows 11 / Ubuntu；Node.js 22.13
  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 可以粘贴已脱敏的日志或截图。
